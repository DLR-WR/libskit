version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - doxygen
    - graphviz
  jobs:
    pre_build:
      - mkdir -p docs/build/doxygen && cd docs/source && doxygen Doxyfile

python:
  install:
    - requirements: docs/requirements.txt
    - requirements: requirements.txt

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false
