[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11", "pybind11-stubgen", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "libskit"
description="A package for simulation and analysis of LIBS spectra."
dynamic = ["version"]
readme = "README.md"
authors = [
  { name = "Christoph H. Egerland", email = "christoph.egerland@dlr.de" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Runtime dependencies - these are installed when user runs: pip install libskit
dependencies = [
  "numpy>=1.20.0",
  "pandas>=1.3.0",
  "scipy>=1.7.0",
  "matplotlib>=3.5.0",
  "pydantic>=2.0.0",
  "molmass>=2021.6.18",
  "nlopt>=2.7.0",
]

[project.optional-dependencies]
test = ["pytest"]
# Full dependencies including visualization extras
full = [
  "plotly>=5.0.0",
  "ipywidgets>=7.6.0",
  "ipympl",
]
dev = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
  "ruff",
  "pydantic>=2.0.0",
]

[tool.coverage.run]
source = ["libskit"]
omit = [
  "*/tests/*",
  "*/_libskit*",
  "*/ml/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
src = ["src"]

[tool.scikit-build]
build.verbose = true
cmake.build-type = "Release"
cmake.args = ["-DBUILD_TESTING=OFF"]
logging.level = "INFO"
build-dir = "build/{wheel_tag}"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/libskit/_version.py"]
wheel.packages = ["src/libskit"]

[tool.setuptools_scm]
write_to = "src/libskit/_version.py"
fallback_version = "0.1.0.dev"

# =============================================================================
# Semantic Release Configuration
# Automatically determines version bumps based on commit messages
# =============================================================================
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Note: _version.py is auto-generated by setuptools_scm from git tags, no need to update it here
branch = "main"
build_command = "ENZYME_PREFIX=/tmp/libskit-enzyme-release bash ./scripts/setup_enzyme_toolchain.sh && pip install build && CC=clang CXX=clang++ CMAKE_ARGS='-DENZYME_PLUGIN_PATH=/tmp/libskit-enzyme-release/ClangEnzyme.so' python -m build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.remote]
type = "gitlab"
token = { env = "GITLAB_TOKEN" }

[tool.semantic_release.changelog]
# Moved from changelog_file to default_templates.changelog_file per v10 migration
[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
# Conventional commits: fix, feat, feat!, BREAKING CHANGE
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

# =============================================================================
# Commitizen Configuration (for commit message validation)
# Used by: cz check, pre-commit hooks, and CI validation
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["src/libskit/_version.py:__version__"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

# =============================================================================
# cibuildwheel configuration for cross-platform wheel building
# =============================================================================
[tool.cibuildwheel]
# Build for Python 3.9+ (scipy 1.14+ requires Python 3.10+ for newer features)
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
# Skip musllinux (Alpine) and PyPy builds
skip = "*-musllinux_* pp*"

# Test the built wheels
test-requires = ["pytest", "numpy"]
test-command = "python -c \"import libskit; print('libskit imported successfully')\""

[tool.cibuildwheel.linux]
# Use manylinux_2_28 for better scipy wheel compatibility (glibc 2.28+)
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Build for x86_64 only in CI (aarch64 requires native runner or local build)
# For local builds with QEMU, use: CIBW_ARCHS_LINUX="x86_64 aarch64" ./scripts/build_wheels.sh
archs = ["x86_64"]
# Build Enzyme against the container's LLVM toolchain before invoking scikit-build.
before-all = "bash /project/scripts/setup_enzyme_toolchain.sh"
# Upgrade pip first to ensure wheel resolution works correctly
before-build = "pip install --upgrade pip && pip install pybind11 pybind11-stubgen"
# Ensure pip can find manylinux wheels for scipy
environment = { PIP_ONLY_BINARY = "scipy", ENZYME_PREFIX = "/tmp/libskit-enzyme", CC = "clang", CXX = "clang++", CMAKE_ARGS = "-DENZYME_PLUGIN_PATH=/tmp/libskit-enzyme/ClangEnzyme.so" }
# Forward the setuptools_scm pretend-version from the outer CI env into the
# manylinux build container so workflow_dispatch dry-runs produce a clean
# PEP 440 version instead of a rejected local segment (e.g. +g<sha>).
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LIBSKIT"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "bash {project}/scripts/setup_enzyme_toolchain.sh"
before-build = "pip install pybind11 pybind11-stubgen"
environment = { ENZYME_PREFIX = "C:/libskit-enzyme", CC = "clang", CXX = "clang++", CMAKE_ARGS = "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DENZYME_PLUGIN_PATH=C:/libskit-enzyme/ClangEnzyme.so" }
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LIBSKIT", "LLVM_PATH"]

[tool.cibuildwheel.macos]
# Per-arch native builds are driven from release.yml (macos-13 = x86_64,
# macos-14 = arm64), so we do not list archs here.
# Homebrew LLVM (installed by the CI workflow) provides clang + llvm-config;
# setup_enzyme_toolchain.sh then builds ClangEnzyme against it.
before-all = "bash {project}/scripts/setup_enzyme_toolchain.sh"
before-build = "pip install pybind11 pybind11-stubgen"
environment = { ENZYME_PREFIX = "/tmp/libskit-enzyme", CC = "clang", CXX = "clang++", CMAKE_ARGS = "-DENZYME_PLUGIN_PATH=/tmp/libskit-enzyme/ClangEnzyme.so", MACOSX_DEPLOYMENT_TARGET = "13.0" }