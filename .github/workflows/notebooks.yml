name: Notebook tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Run tutorial notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Enzyme toolchain
        uses: ./.github/actions/setup-enzyme

      - name: Install package and notebook tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install . jupyter nbconvert nbformat

      - name: Run notebook tests
        run: |
          chmod +x tests/run_notebook_tests.sh
          ./tests/run_notebook_tests.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-logs
          path: "*.log"
          retention-days: 7
