name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.9.1"
      # Advisory: pre-existing lint debt (E402/F401/E741). Drop --exit-zero after cleanup.
      - run: ruff check --output-format=github --exit-zero src tests

  python_versions:
    name: Read supported Python versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      test_version: ${{ steps.versions.outputs.test_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: versions
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          versions = project["tool"]["libskit"]["supported-python-versions"]
          numbers = [tuple(map(int, version.split("."))) for version in versions]
          if len(numbers) < 2 or numbers != sorted(set(numbers)):
              raise ValueError("Supported Python versions must be unique and ascending")
          if any(b != (a[0], a[1] + 1) for a, b in zip(numbers, numbers[1:])):
              raise ValueError("Supported Python versions must be consecutive")
          expected_range = f">={versions[0]},<{numbers[-1][0]}.{numbers[-1][1] + 1}"
          if project["project"]["requires-python"] != expected_range:
              raise ValueError(
                  f"requires-python must match supported versions: {expected_range}"
              )
          classifiers = set(project["project"]["classifiers"])
          if any(
              f"Programming Language :: Python :: {version}" not in classifiers
              for version in versions
          ):
              raise ValueError("Python classifiers must include every supported version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(versions)}\n")
              output.write(f"test_version={versions[-2]}\n")
          print(f"Build Python versions: {', '.join(versions)}")
          print(f"Full test suite: Python {versions[-2]} (second newest supported)")
          PY

  build-and-test:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: python_versions
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python_versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup Enzyme toolchain
        uses: ./.github/actions/setup-enzyme

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pybind11 must match the interpreter's ABI; system pybind11-dev (2.x)
          # mixed with the venv's numpy 2.x causes SEGFAULT in the Eigen caster.
          pip install pybind11
          pip install pytest pytest-cov "coverage[toml]"

      - name: Configure
        env:
          RUN_FULL_TESTS: ${{ matrix.python-version == needs.python_versions.outputs.test_version }}
        run: |
          rm -f build/CMakeCache.txt
          PYBIND11_DIR=$(python -c 'import pybind11, sys; sys.stdout.write(pybind11.get_cmake_dir())')
          if [[ "$RUN_FULL_TESTS" == "true" ]]; then
            BUILD_TESTING=ON
          else
            BUILD_TESTING=OFF
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -Dpybind11_DIR="$PYBIND11_DIR" \
            -DPython_EXECUTABLE="$(which python)" \
            -DBUILD_TESTING="$BUILD_TESTING" \
            -DENZYME_PLUGIN_PATH="$ENZYME_PLUGIN_PATH"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: C++ tests (ctest)
        if: matrix.python-version == needs.python_versions.outputs.test_version
        run: ctest --test-dir build --output-on-failure --output-junit test-results-cpp.xml

      - name: Python tests (pytest + coverage)
        if: matrix.python-version == needs.python_versions.outputs.test_version
        env:
          PYTHONPATH: build
        run: |
          pytest tests/ \
            --junitxml=test-results-python.xml \
            --cov=libskit --cov-report=xml:coverage.xml --cov-report=term \
            -v --ignore=tests/test_utils.py
          coverage report --fail-under=25

      - name: Upload test artifacts
        if: always() && matrix.python-version == needs.python_versions.outputs.test_version
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results-cpp.xml
            test-results-python.xml
            coverage.xml
          retention-days: 14

      - name: Publish test summary
        if: always() && matrix.python-version == needs.python_versions.outputs.test_version
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results (Python ${{ matrix.python-version }})
          junit_files: |
            test-results-cpp.xml
            test-results-python.xml

  docs-smoke:
    name: Docs smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: Install doc deps
        # Runtime deps too: autodoc imports libskit.* modules which pull in pandas/scipy/etc.
        run: pip install -r docs/requirements.txt -r requirements.txt
      - name: Doxygen
        run: |
          mkdir -p docs/build/doxygen
          cd docs/source && doxygen Doxyfile
      - name: Sphinx build
        run: make -C docs html
