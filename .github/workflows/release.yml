name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (pypi = production, testpypi = dry run)"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      version:
        # Required because setuptools_scm otherwise generates a local segment
        # like 0.2.dev4+g9f773c6c1 which PyPI rejects (PEP 440 local versions).
        description: "Version to publish (must be PEP 440, e.g. 0.1.0rc1, 0.1.0.dev1)"
        required: true
        default: 0.0.0.dev0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # For workflow_dispatch runs, pin the version so setuptools_scm does not
  # emit a PyPI-invalid local segment (e.g. 0.2.dev4+g9f773c6c1). For tag
  # pushes this is empty and setuptools_scm resolves the tag naturally.
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LIBSKIT: ${{ inputs.version }}

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cibw_archs: x86_64
          - os: macos-14
            arch: arm64
            cibw_archs: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # macOS: Enzyme needs a real LLVM (not Apple Clang) with matching
      # llvm-config. Homebrew ships one; we put it on PATH so the existing
      # scripts/setup_enzyme_toolchain.sh picks it up (it runs inside
      # cibuildwheel's before-all on the host, not in a container).
      - name: Install Homebrew LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LDFLAGS=-L$LLVM_PREFIX/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> "$GITHUB_ENV"

      - name: Build wheels (cibuildwheel)
        # Enzyme setup:
        #   * Linux: inside the manylinux container via [tool.cibuildwheel.linux].before-all
        #   * macOS: on the host via [tool.cibuildwheel.macos].before-all
        # Windows wheels are not built: the official LLVM Windows binaries do
        # not ship the static Clang dev libs Enzyme needs. Windows users install
        # from sdist and provide their own LLVM+Enzyme toolchain.
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 14

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 14

  publish:
    name: Publish to PyPI + GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Environment binds Trusted Publishing; PyPI project must whitelist
    # (owner/repo, workflow=release.yml, environment=pypi|testpypi).
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
